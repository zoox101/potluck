# Free Supabase projects pause after a week without activity; ping every 3 days.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          url=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" web/config.js)
          key=$(sed -n "s/.*SUPABASE_KEY = '\(.*\)'.*/\1/p" web/config.js)
          curl -fsS -X POST "$url/rest/v1/rpc/ping" -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
