# Publish web/ to GitHub Pages on every push to main.
name: Pages
on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Bust browser caches: every deploy loads its own app.js, sdk.js, config.js and style.css.
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" web/index.html web/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
