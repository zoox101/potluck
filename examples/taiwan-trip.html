<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taiwan Trip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: #1d1d1b; }
    body { display: flex; }
    #mapwrap { position: relative; flex: 1; min-width: 0; }
    #map { position: absolute; inset: 0; }
    .overlay { position: absolute; z-index: 1000; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
    #food { top: 8px; right: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
    #legend { bottom: 20px; left: 8px; padding: 4px 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; max-width: calc(100% - 16px); }
    #status { top: 8px; left: 8px; padding: 6px 10px; }
    #status:empty { display: none; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
    aside { width: 420px; overflow-y: auto; border-left: 1px solid #ddd; padding: 14px; display: none; flex-direction: column; gap: 10px; background: #fff; }
    aside.open { display: flex; }
    aside > * { flex-shrink: 0; }
    .photos { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; }
    .photos img { height: 160px; width: 85%; flex-shrink: 0; object-fit: cover; border-radius: 8px; scroll-snap-align: center; }
    .head { display: flex; justify-content: space-between; gap: 10px; }
    h2 { margin: 0; font-size: 16px; }
    .muted { color: #6b6b66; font-size: 12px; }
    .rec { background: #f3f3f0; border-radius: 6px; padding: 8px; }
    .votes { display: flex; gap: 12px; white-space: nowrap; overflow: hidden; font-size: 12px; list-style: none; padding: 0; margin: 0; }
    .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button { font: inherit; min-height: 40px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    .links { display: flex; gap: 4px; }
    .links a { flex: 1; text-align: center; padding: 10px; border: 1px solid #ccc; border-radius: 6px; color: inherit; text-decoration: none; }
    @media (max-width: 700px) {
      body { flex-direction: column; }
      aside { width: auto; height: 50%; border-left: 0; border-top: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div id="mapwrap">
    <div id="map"></div>
    <button id="food" class="overlay">Hide restaurants</button>
    <div id="legend" class="overlay"></div>
    <div id="status" class="overlay">Loading Taiwan trip...</div>
  </div>
  <aside id="panel"></aside>
  <script>
    // Data: will.taiwan_places (snapshot of the Taiwan Together trip) and will.taiwan_votes,
    // where each vote is a new row and a traveler's latest row for a place counts ("clear" removes it).
    const PLACES = 'will.taiwan_places', VOTES = 'will.taiwan_votes';
    const STYLE = {
      must_do: ['Must do', '#dc2626'], interested: ['Interested', '#2563eb'], meh: ['Meh', '#9333ea'],
      pass: ['Pass', '#6b7280'], not_voted: ['Not voted', '#f97316'],
    };
    const CHOICES = ['must_do', 'interested', 'meh', 'pass'];
    const $ = (id) => document.getElementById(id);
    const status = (text) => ($('status').textContent = text);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    let places = [], me = null, selected = null, hideFood = false;
    const votes = new Map(); // place id -> Map(lowercased traveler -> {traveler, vote, id})

    function record(v) {
      const forPlace = votes.get(v.place_id) ?? new Map();
      const key = v.traveler.toLowerCase();
      if ((forPlace.get(key)?.id ?? 0) < v.id) forPlace.set(key, v);
      votes.set(v.place_id, forPlace);
    }
    const placeVotes = (p) => [...(votes.get(p.id)?.values() ?? [])].filter((v) => v.vote !== 'clear').sort((a, b) => a.traveler.localeCompare(b.traveler));
    const myVote = (p) => { const v = votes.get(p.id)?.get(me.toLowerCase()); return v && v.vote !== 'clear' ? v.vote : 'not_voted'; };

    const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([23.7, 120.9], 8);
    map.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, referrerPolicy: 'origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    new ResizeObserver(() => map.invalidateSize()).observe($('mapwrap'));

    $('legend').innerHTML = Object.values(STYLE).map(([label, color]) => `<span><span class="dot" style="background:${color}"></span>${label}</span>`).join('')
      + '<span>Dark ring: on Will\'s World Map</span>';
    $('food').onclick = () => { hideFood = !hideFood; $('food').textContent = hideFood ? 'Show restaurants' : 'Hide restaurants'; draw(); };

    function draw() {
      layer.clearLayers();
      for (const p of places) {
        if (p.lat == null || (hideFood && p.category === 'food')) continue;
        const isSel = p.id === selected;
        L.circleMarker([p.lat, p.lng], {
          radius: isSel ? 11 : 8, fillColor: STYLE[myVote(p)][1], fillOpacity: 0.95,
          color: p.world_map ? '#111827' : '#ffffff', weight: p.world_map || isSel ? 3 : 1.5,
        }).on('click', () => { selected = p.id; draw(); panel(); }).addTo(layer);
      }
    }

    function panel() {
      const p = places.find((x) => x.id === selected);
      const el = $('panel');
      el.classList.toggle('open', !!p);
      if (!p) return;
      const mine = myVote(p);
      const source = p.photos?.[0]?.source;
      el.innerHTML = `
        ${p.photos?.length ? `<div class="photos">${p.photos.map((ph, i) => `<img src="${esc(ph.url)}" alt="${esc(ph.caption || p.name)}" title="${esc(ph.caption)}" loading="${i ? 'lazy' : 'eager'}">`).join('')}</div>` : ''}
        <div class="head">
          <div>
            <h2>${esc(p.name)} <span class="muted" style="font-size:14px">${esc(p.chinese)}</span></h2>
            <div class="muted">${esc(p.city)} · ${esc(p.category)}${p.duration_hours ? ` · ${p.duration_hours} h` : ''}${p.world_map ? ' · On Will\'s World Map' : ''}</div>
          </div>
          <button id="close" style="min-width:40px" aria-label="Close">✕</button>
        </div>
        ${p.recommendation ? `<div class="rec"><b>Claude:</b> ${esc(p.recommendation)}</div>` : ''}
        <div class="muted" style="font-size:14px">${esc(p.description)}</div>
        <ul class="votes">${placeVotes(p).map((v) => `<li title="${esc(v.traveler)}: ${STYLE[v.vote]?.[0] ?? esc(v.vote)}"><span class="dot" style="background:${STYLE[v.vote]?.[1] ?? STYLE.not_voted[1]}"></span>${esc(v.traveler)}</li>`).join('')}</ul>
        <div class="choices">${CHOICES.map((c) => `<button data-vote="${c}" aria-pressed="${mine === c}" style="${mine === c ? `background:${STYLE[c][1]};border-color:${STYLE[c][1]};color:#fff` : ''}">${STYLE[c][0]}</button>`).join('')}</div>
        <div class="links">
          ${p.google_maps_url ? `<a href="${esc(p.google_maps_url)}" target="_blank" rel="noreferrer">Google Maps ↗</a>` : ''}
          ${source ? `<a href="${esc(source)}" target="_blank" rel="noreferrer">Wikimedia ↗</a>` : ''}
        </div>`;
      $('close').onclick = () => { selected = null; draw(); panel(); };
      el.querySelectorAll('[data-vote]').forEach((b) => (b.onclick = () => vote(p, mine === b.dataset.vote ? 'clear' : b.dataset.vote)));
    }

    async function vote(p, choice) {
      try {
        record(await db.insert(VOTES, { place_id: p.id, traveler: me, vote: choice }));
        status('');
      } catch (e) { status(e.message); }
      draw(); panel();
    }

    async function load() {
      const user = await db.me();
      const [rows, voteRows] = await Promise.all([
        db.query(`select id, slug, name, chinese, city, area, category, description, duration_hours, cost, lat, lng,
                         google_maps_url, photos, recommendation, world_map from ${PLACES} order by name`),
        db.query(`select id, place_id, traveler, vote from ${VOTES}`),
      ]);
      places = rows;
      voteRows.forEach(record);
      // Vote as the imported traveler whose name matches the username (e.g. "will" -> "Will").
      const travelers = new Set(voteRows.map((v) => v.traveler));
      me = [...travelers].find((t) => t.toLowerCase() === user) ?? user;
      status('');
      draw();
    }

    db.subscribe(VOTES, ({ new: row }) => { if (row?.id) { record(row); draw(); panel(); } });
    load().catch((e) => status(e.message));
  </script>
</body>
</html>
