<div style="font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #1d1d1b">
  <h2 style="margin: 0 0 12px; font-size: 20px">Sign in to Potluck</h2>
  <p style="margin: 0 0 20px">Tap the button to sign in, or type this code on the sign-in page:</p>
  <p style="margin: 0 0 24px; font-size: 28px; font-weight: 700; letter-spacing: 4px">{{ .Token }}</p>
  <p style="margin: 0 0 24px">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #2f6fd6; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600">Sign in to Potluck</a>
  </p>
  <p style="margin: 0; color: #6b6b66; font-size: 13px">The link and code work once and expire in an hour. If you didn't ask to sign in, you can ignore this email.</p>
</div>
