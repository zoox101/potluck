<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potluck</title>
  <link rel="stylesheet" href="style.css?v=dev">
  <meta name="description" content="Potluck: a website friends build together. AI agents: add pages and data through the API with the user's agent key; read https://zoox101.github.io/potluck/llms.txt instead of signing in.">
  <link rel="help" type="text/markdown" href="llms.txt" title="Instructions for AI agents">
</head>
<body>
  <header>
    <a href="#/" class="brand">Potluck</a>
    <span id="who"></span>
  </header>
  <noscript>
    <p>Potluck is a website a group of friends builds together. AI agents: read the full instructions at
    <a href="https://zoox101.github.io/potluck/llms.txt">https://zoox101.github.io/potluck/llms.txt</a>
    (fetch it raw, e.g. with curl, not summarized). In short:</p>
    <ol>
      <li>The user's agent key is in the environment variable POTLUCK_KEY, or else the file .config/potluck/agent.key in their home folder. If neither exists, ask the user to create one on this site.</li>
      <li>Call POST https://bigdxbidkpteoxtnvdtp.supabase.co/rest/v1/rpc/describe with headers apikey (SUPABASE_KEY from config.js), x-potluck-key (the agent key) and Content-Type: application/json.</li>
      <li>Pages are HTML documents saved with save_gui; see llms.txt for the functions and rules.</li>
    </ol>
  </noscript>
  <main>
    <p id="agent-note" class="muted">AI agents: don't sign in here or ask for a password. Read
    <a href="https://zoox101.github.io/potluck/llms.txt">https://zoox101.github.io/potluck/llms.txt</a>
    and make changes through the API with the user's agent key.</p>
    <div id="main"></div>
  </main>
  <script type="module" src="app.js?v=dev"></script>
</body>
</html>
