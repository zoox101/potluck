<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potluck</title>
  <link rel="stylesheet" href="style.css?v=dev">
  <meta name="description" content="Potluck: a dashboard of apps a group of friends builds together. View it by signing in; edit it (add or change apps and data) through the Potluck API with an agent key, as described at https://zoox101.github.io/potluck/llms.txt.">
  <link rel="help" type="text/markdown" href="llms.txt" title="Instructions for AI agents">
</head>
<body>
  <header id="top">
    <a href="#/" class="brand">Potluck</a>
  </header>
  <div id="drawer" hidden></div>
  <noscript>
    <p>Potluck is a dashboard of apps a group of friends builds together. Viewing it requires signing in (and JavaScript).
    Editing it (adding or changing apps and data) is done through the Potluck API with an agent key; the full guide is at
    <a href="https://zoox101.github.io/potluck/llms.txt">https://zoox101.github.io/potluck/llms.txt</a>
    (fetch it raw, e.g. with curl, not summarized). In short:</p>
    <ol>
      <li>The user's agent key is in the environment variable POTLUCK_KEY, or else the file .config/potluck/agent.key in their home folder. If neither exists, ask the user to create one on this site.</li>
      <li>Call POST https://bigdxbidkpteoxtnvdtp.supabase.co/rest/v1/rpc/describe with headers apikey (SUPABASE_KEY from config.js), x-potluck-key (the agent key) and Content-Type: application/json.</li>
      <li>Pages are HTML documents created with create_gui; see llms.txt for the functions and rules.</li>
    </ol>
  </noscript>
  <main>
    <div id="main"></div>
  </main>
  <script type="module" src="app.js?v=dev"></script>
</body>
</html>
